baseURL = "https://my-blog-2d3.pages.dev/"
languageCode = "zh-cn"
title = "我的博客"
theme = "PaperMod"

# 多语言配置
[languages.zh-cn]
  languageCode = "zh-cn"
  languageName = "中文"
  weight = 1

# 输出格式配置
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 网站参数
[params]
  # 主题设置
  defaultTheme = "auto"
  disableThemeToggle = false
  disableSpecial1stPost = false
  disableScrollToTop = false
  hideMeta = false
  hideSummary = false
  
  # 功能开关
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = true
  ShowPageNums = true
  
  # 首页配置
  [params.homeInfoParams]
    Title = "欢迎来到我的博客"
    Content = "这里是我分享技术、生活和思考的地方<br>探索、学习、成长"
    AlignSocialIconsTo = "left"
  # 社交媒体链接
  socialIcons = [
    { name = "github", url = "https://github.com/yourusername" },
    { name = "twitter", url = "https://twitter.com/yourusername" },
    { name = "linkedin", url = "https://linkedin.com/in/yourusername" },
    { name = "rss", url = "index.xml" }
  ]
  
  # 搜索功能
  fuseOpts = { isCaseSensitive = false, shouldSort = true, location = 0, distance = 1000, threshold = 0.6, minMatchCharLength = 0, keys = ["title", "permalink", "summary", "content"] }
  
  # 代码高亮
  highlight = true
  highlightStyle = "github"
  highlightLanguages = ["python", "javascript", "go", "java", "cpp", "bash", "sql", "yaml", "toml", "json"]
  
  # 目录配置
  toc = true
  tocOpen = false
  
  # SEO优化
  description = "我的个人博客，分享技术、生活和思考"
  keywords = ["技术", "博客", "编程", "学习"]
  author = "作者名"
  images = ["/images/og-image.png"]
  
  # 评论系统（可选）
  # comments = true
  # utterances = { repo = "yourusername/your-repo", issueTerm = "pathname", label = "comments" }
  
  # 分析工具（可选）
  # googleAnalytics = "UA-XXXXXXXXX-X"
  # plausible = "yourdomain.com"
  
  # 自定义CSS/JS
  # customCSS = ["css/custom.css"]
  # customJS = ["js/custom.js"]

# 菜单配置
[[menu.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = 1

[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 2

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 3

[[menu.main]]
  identifier = "categories"
  name = "分类"
  url = "/categories/"
  weight = 4

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 5

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 6

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 7

# 社交菜单（显示在页脚）
[[menu.social]]
  identifier = "github"
  name = "GitHub"
  url = "https://github.com/yourusername"
  weight = 1

[[menu.social]]
  identifier = "twitter"
  name = "Twitter"
  url = "https://twitter.com/yourusername"
  weight = 2

# 分类和标签配置
[taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"
  author = "authors"

# 分页配置
[pagination]
  pagerSize = 10

# 服务配置
[services]
  [services.googleAnalytics]
    id = ""  # 如果需要Google Analytics，请填写ID

# 隐私配置
[privacy]
  [privacy.twitter]
    disable = false

  [privacy.instagram]
    disable = false

  [privacy.youtube]
    disable = false
    privacyEnhanced = true

# 安全配置
[security]
  [security.exec]
    allow = ['^dart-sass-embedded$', '^go$', '^npx$', '^postcss$', '^npm$', '^yarn$']
    osEnv = ['(?i)^(PATH|PATHEXT|APPDATA|TMP|TEMP|TERM)$']

  [security.funcs]
    getenv = ['^HUGO_', '^CI$', '^TRAVIS$']

